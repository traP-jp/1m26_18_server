services:
  mariadb:
    image: mariadb:10.11.19-jammy@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: database
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 10

  adminer:
    image: adminer:6.0.1@sha256:043db066c4532719f49e35355a620f0bbe48fc862f6bfccda72f441b162f092e
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
